<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador de migraña</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="viewport-shell">
      <header class="project-header">
        <div>
          <p class="eyebrow">COMPUTACIÓN AVANZADA · MCD UAI</p>
          <h1>Visualizador de migraña</h1>
          <p class="subtitle">
            Lab02; Aurora San Martín
          </p>
        </div>
      </header>

      <div id="viewport"></div>

      <div class="hint">
        Arrastra para orbitar · Rueda para acercar · Click derecho para desplazar
      </div>
    </section>

    <aside class="controls-panel">
      <div class="panel-header">
        <p class="eyebrow">PARÁMETROS</p>
        <h2>Espacio de diseño</h2>
      </div>

      <section class="control-group">
        <h3>Comportamiento</h3>

        <label>
          <span>Contraste</span>
          <output id="amplitud-valor">3.00</output>
          <input id="amplitud" type="range" min="0" max="6" step="0.1" value="3" />
        </label>

        <label>
          <span>Frecuencia</span>
          <output id="frecuencia-valor">0.40</output>
          <input id="frecuencia" type="range" min="0.05" max="1.2" step="0.05" value="0.4" />
        </label>

        <label>
          <span>Rotación</span>
          <output id="rotacion-valor">0.30</output>
          <input id="rotacion" type="range" min="0.3" max="0.3" step="0.05" value="0.3" disabled />
        </label>
      </section>

      <section class="control-group">
        <h3>Variación</h3>

        <label>
          <span>Aleatoriedad</span>
          <output id="aleatoriedad-valor">0.00</output>
          <input id="aleatoriedad" type="range" min="0" max="1.5" step="0.05" value="0" />
        </label>

        <label>
          <span>Semilla</span>
          <output id="semilla-valor">42</output>
          <input id="semilla" type="range" min="1" max="100" step="1" value="42" />
        </label>

        <label>
          <span>Visual</span>
          <output id="visual-valor">1</output>
          <input id="visual" type="range" min="1" max="5" step="1" value="1" />
        </label>

        <label>
          <span>Ruido</span>
          <output id="ruido-valor">0.00</output>
          <input id="ruido" type="range" min="0" max="0.49" step="0.01" value="0" />
        </label>

        <label>
          <span>Calor</span>
          <output id="calor-valor">0.00</output>
          <input id="calor" type="range" min="0" max="1" step="0.01" value="0" />
        </label>

        <label>
          <span>Olor</span>
          <output id="olor-valor">0.00</output>
          <input id="olor" type="range" min="0" max="1" step="0.01" value="0" />
        </label>

        <label>
          <span>Migraña</span>
          <output id="migrana-valor">0.00</output>
          <input id="migrana" type="range" min="0" max="1" step="0.01" value="0" />
        </label>
      </section>

      <div class="actions">
        <button id="regenerar">Regenerar</button>
        <button id="restablecer" class="secondary">Restablecer</button>
      </div>

      <footer class="panel-footer">
        <p>
          Pregunta guía:<br />
          <strong>¿Qué cambia cuando diseñamos las reglas y no una forma única?</strong>
        </p>
      </footer>
    </aside>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
